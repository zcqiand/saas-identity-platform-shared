          items:
            $ref: '#/components/schemas/TenantMembership'
        currentTenantId:
          type: string
          format: uuid
    EffectiveMenuNode:
      type: object
      required:
        - id
        - appId
        - code
        - name
        - type
        - sortOrder
        - children
      properties:
        id:
          type: string
          format: uuid
        appId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        path:
          type: string
        icon:
          type: string
        type:
          $ref: '#/components/schemas/MenuType'
        sortOrder:
          type: integer
          format: int32
        children:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveMenuNode'
