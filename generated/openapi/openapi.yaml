components:
  schemas:
    ApiKey:
      type: object
      required:
        - id
        - tenantId
        - name
        - prefix
        - status
        - scopes
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 128
        prefix:
          type: string
          minLength: 8
          maxLength: 16
        status:
          $ref: '#/components/schemas/ApiKeyStatus'
        scopes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
    ApiKeyStatus:
      type: string
      enum:
        - active
        - revoked
        - expired
    App:
      type: object
      required:
        - id
        - code
        - name
        - sortOrder
        - status
        - clientId
        - redirectUris
        - scopes
        - grantTypes
        - isFirstParty
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 2
          maxLength: 64
        name:
          type: string
          minLength: 2
          maxLength: 255
        description:
          type: string
        icon:
          type: string
        sortOrder:
          type: integer
          format: int32
          example: 0
        status:
          $ref: '#/components/schemas/AppStatus'
        clientId:
          type: string
          minLength: 2
          maxLength: 128
        clientSecret:
          type: string
        redirectUris:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        grantTypes:
          type: array
          items:
            $ref: '#/components/schemas/OAuthGrantType'
        isFirstParty:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AppPublicInfo:
      type: object
      required:
        - id
        - code
        - name
        - status
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 2
          maxLength: 64
        name:
          type: string
          minLength: 2
          maxLength: 255
        description:
          type: string
        icon:
          type: string
        status:
          $ref: '#/components/schemas/AppStatus'
    AppStatus:
      type: string
      enum:
        - active
        - disabled
    AuditAction:
      type: string
      enum:
        - user_created
        - user_updated
        - user_deleted
        - role_assigned
        - role_revoked
        - login_success
        - login_failed
        - oauth_token_issued
        - api_key_created
        - api_key_revoked
    AuditEvent:
      type: object
      required:
        - id
        - tenantId
        - action
        - occurredAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        actorUserId:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/AuditAction'
        targetUserId:
          type: string
          format: uuid
        metadata:
          type: object
          additionalProperties: {}
        occurredAt:
          type: string
          format: date-time
    AuthorizeCodeRequest:
      type: object
      required:
        - clientId
        - redirectUri
        - responseType
        - scope
        - state
        - tenantId
      properties:
        clientId:
          type: string
          format: uuid
        redirectUri:
          type: string
          minLength: 1
          maxLength: 2048
        responseType:
          type: string
          enum:
            - code
        scope:
          type: string
        state:
          type: string
        tenantId:
          type: string
          format: uuid
    CreateApiKeyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 128
        scopes:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
    CreateApiKeyResponse:
      type: object
      required:
        - apiKey
        - secret
      properties:
        apiKey:
          $ref: '#/components/schemas/ApiKey'
        secret:
          type: string
          minLength: 16
          maxLength: 256
    CreateAppRequest:
      type: object
      required:
        - code
        - name
        - clientId
        - redirectUris
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 64
        name:
          type: string
          minLength: 2
          maxLength: 255
        description:
          type: string
        icon:
          type: string
        sortOrder:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/AppStatus'
        clientId:
          type: string
          minLength: 2
          maxLength: 128
        clientSecret:
          type: string
        redirectUris:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        grantTypes:
          type: array
          items:
            $ref: '#/components/schemas/OAuthGrantType'
        isFirstParty:
          type: boolean
    CreateMenuRequest:
      type: object
      required:
        - code
        - name
      properties:
        parentId:
          type: string
          format: uuid
        code:
          type: string
          minLength: 2
          maxLength: 64
        name:
          type: string
          minLength: 2
          maxLength: 255
        path:
          type: string
        icon:
          type: string
        type:
          $ref: '#/components/schemas/MenuType'
        sortOrder:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/MenuStatus'
    CreateRoleRequest:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        permissionIds:
          type: array
          items:
            type: string
    CreateTenantRequest:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 64
        name:
          type: string
          minLength: 2
          maxLength: 255
        settings:
          $ref: '#/components/schemas/TenantSettings'
    CreateUserRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        email:
          type: string
          format: email
        displayName:
          type: string
        password:
          type: string
        roleIds:
          type: array
          items:
            type: string
    CurrentUser:
      type: object
